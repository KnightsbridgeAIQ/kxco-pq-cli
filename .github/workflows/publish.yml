name: publish

# Triggered by pushing a v* tag (e.g. v0.1.0), or manually via the Actions UI.
#
# Auth path: NPM_TOKEN secret (automation token). Set this secret at
# https://github.com/JackKXCO/kxco-pq-cli/settings/secrets/actions
# using the automation token from the kxco npm account.
#
# All third-party actions are pinned by 40-char commit SHA.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag or ref to publish (e.g. v0.1.0)'
        required: true
        type: string

permissions:
  contents: read
  id-token: write   # required for Trusted Publishing OIDC and --provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Setup Node 22 with npm registry
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm CLI to the 11.x line
        # Trusted Publishing's OIDC integration needs npm >= 11.5.1 and the npm
        # bundled with the runner's Node is older. Pinned to 11.x, never @latest:
        # npm 12 requires Node ^22.22 || ^24.15 || >=26, and @latest broke this
        # exact step in kxco-post-quantum, so an unpinned install is an outage.
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Publish
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
